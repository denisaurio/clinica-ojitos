# =============================================================================
#  Perfil de desarrollo local
#  Uso:  mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#       SPRING_PROFILES_ACTIVE=dev mvnw spring-boot:run
# =============================================================================

spring:
  jpa:
    hibernate:
      # En desarrollo se permite a Hibernate crear tablas faltantes a partir de
      # las entidades. En producción se usa `validate` (ver application.yml).
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}

logging:
  level:
    com.clinicaojitos: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.springframework.web: INFO

app:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
