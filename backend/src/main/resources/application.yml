# =============================================================================
#  Clínica Oftalmológica Ojitos — Configuración base del backend
#  Las credenciales NUNCA se versionan: se leen del entorno.
# =============================================================================

spring:
  application:
    name: clinica-ojitos-backend
    profiles:
      default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clinica_ojitos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: ClinicaOjitosPool

  jpa:
    # El esquema lo crea sql/01_esquema.sql. El backend solo valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.time_zone: America/Lima
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

# --- Seguridad (RF-06) ------------------------------------------------------
app:
  jwt:
    # Cadena de firma del token.
    #
    # NO se publica ninguna clave en el repositorio. Definela por variable de
    # entorno antes de arrancar, con al menos 32 caracteres:
    #     export JWT_SECRET="$(openssl rand -base64 48)"
    # Si no se define, la aplicación arranca en modo deshabilitado y lo avisa
    # por consola; no se firmará ningún token.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

# --- Documentación ----------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# --- Logging ----------------------------------------------------------------
logging:
  level:
    root: INFO
    com.clinicaojitos: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"