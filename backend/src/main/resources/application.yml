# =============================================================================
#  Clínica Oftalmológica Ojitos — Configuración base del backend
#  Las credenciales NUNCA se versionan: se leen del entorno.
#  Todas las claves admiten sobreescritura por variable de entorno para que el
#  despliegue (Coolify/VPS) se configure al 100 % desde Shared Variables.
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: clinica-ojitos-backend
    profiles:
      # Perfil activo por defecto. En producción: SPRING_PROFILES_ACTIVE=prod.
      default: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clinica_ojitos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      pool-name: ${DB_POOL_NAME:ClinicaOjitosPool}

  jpa:
    # El esquema lo crea sql/01_esquema.sql. En producción, `validate`.
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.time_zone: ${APP_TIMEZONE:America/Lima}
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST:25MB}

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

# --- Seguridad (RF-06) ------------------------------------------------------
app:
  jwt:
    # Cadena de firma del token.
    #
    # NO se publica ninguna clave en el repositorio. Definela por variable de
    # entorno antes de arrancar, con al menos 32 caracteres:
    #     export JWT_SECRET="$(openssl rand -base64 48)"
    # Si no se define, se genera una clave aleatoria para esa ejecución y se
    # avisa por consola: sirve en desarrollo, pero los tokens dejan de ser
    # válidos al reiniciar el backend.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  cors:
    # Orígenes permitidos, separados por coma. En producción con un solo
    # dominio (nginx del frontend proxya /api) no hace falta abrir CORS.
    # Ejemplo: https://app.midominio.com,http://localhost:4200
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# --- Documentación ----------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# --- Logging ----------------------------------------------------------------
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.clinicaojitos: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
