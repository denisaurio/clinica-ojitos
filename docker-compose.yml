# =============================================================================
#  Clínica Oftalmológica Ojitos — despliegue local con 3 servicios
# =============================================================================
#  Uso:
#      Copy-Item .env.example .env    # PowerShell
#      # edita .env (contraseñas y JWT_SECRET)
#      docker compose up -d --build
#
#  Servicios:
#      mysql  → MySQL 8.4 con volumen persistente y scripts de sql/
#      api    → backend Spring Boot (no se publica: lo consume web)
#      web    → Angular + nginx, único punto de entrada público
#
#  En Coolify no se usa este archivo: cada servicio se crea por separado.
#  Ver docs/DESPLIEGUE.md.
# =============================================================================

name: clinica-ojitos

services:
  mysql:
    image: mysql:8.4
    container_name: clinica-ojitos-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clinica_ojitos}
      MYSQL_USER: ${MYSQL_USER:-clinica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecutan si el volumen está vacío (primer arranque).
      - ./sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./sql/02_datos_prueba.sql:/docker-entrypoint-initdb.d/02_datos_prueba.sql:ro
      - ./sql/04_cuentas_iniciales.sql:/docker-entrypoint-initdb.d/04_cuentas_iniciales.sql:ro
      - ./sql/05_sedes.sql:/docker-entrypoint-initdb.d/05_sedes.sql:ro

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - interna

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica-ojitos-api
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/Lima}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "8080"

      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/clinica_ojitos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&createDatabaseIfNotExist=true}"
      DB_USER: ${DB_USER:-clinica}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_POOL_NAME: ${DB_POOL_NAME:-ClinicaOjitosPool}

      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}

      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_FORZAR_CLAVE: ${ADMIN_FORZAR_CLAVE:-false}

      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-WARN}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-WARN}

      MULTIPART_MAX_FILE: ${MULTIPART_MAX_FILE:-10MB}
      MULTIPART_MAX_REQUEST: ${MULTIPART_MAX_REQUEST:-25MB}

    depends_on:
      mysql:
        condition: service_healthy

    # Se publica solo para depuración local; en producción no hace falta.
    ports:
      - "${SERVER_PORT:-8080}:8080"

    networks:
      - interna

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinica-ojitos-web
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/Lima}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      API_URL: ${API_URL:-/api/v1}
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_NAME: ${APP_NAME:-Ojitos}
      APP_TAGLINE: ${APP_TAGLINE:-Gestión Clínica}
      PRODUCTION: ${PRODUCTION:-true}
      USE_MOCK_API: ${USE_MOCK_API:-false}

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8081}:80"

    networks:
      - interna

volumes:
  mysql_data:
    name: clinica-ojitos-mysql-data

networks:
  interna:
    name: clinica-ojitos-interna
    driver: bridge
